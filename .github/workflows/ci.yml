name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Srndx.sln

      - name: Build
        run: dotnet build Srndx.sln -c Release --no-restore

      - name: Test
        run: dotnet test Srndx.sln -c Release --no-build
