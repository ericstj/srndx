name: CI

# Private repository. CI builds and tests the solution and the RID-specific tool packages on every
# push/PR. On a push to main it publishes a rolling prerelease (0.1.0-ci.<run>) to this repository's
# private GitHub Packages NuGet feed; a v* tag publishes a stable version. It never publishes to NuGet.org.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Srndx.sln

      - name: Build
        run: dotnet build Srndx.sln -c Release --no-restore

      - name: Test
        run: dotnet test Srndx.sln -c Release --no-build --verbosity normal

  pack:
    name: Pack ${{ matrix.rid }}
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native-AOT packages must be produced on the matching OS/architecture.
          - rid: win-x64
            os: windows-latest
            packargs: -r win-x64
          - rid: linux-x64
            os: ubuntu-latest
            packargs: -r linux-x64
          - rid: osx-arm64
            os: macos-latest
            packargs: -r osx-arm64
          # Portable CoreCLR fallback (framework-dependent, no AOT) selected when no RID matches.
          - rid: any
            os: ubuntu-latest
            packargs: -r any -p:PublishAot=false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Native AOT prerequisites (Linux)
        if: matrix.rid == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "arg=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "arg=-p:VersionSuffix=ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack ${{ matrix.rid }}
        run: dotnet pack src/Srndx/Srndx.csproj -c Release ${{ matrix.packargs }} -o artifacts ${{ steps.ver.outputs.arg }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg-${{ matrix.rid }}
          path: artifacts/*.nupkg

  pack-pointer:
    name: Pack pointer package
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Native AOT prerequisites (Linux)
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "arg=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "arg=-p:VersionSuffix=ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # The RID-agnostic "pointer" package wires `dotnet tool install dotnet-srndx` to the
      # per-RID packages above, completing the installable set.
      - name: Pack pointer
        run: dotnet pack src/Srndx/Srndx.csproj -c Release -o artifacts ${{ steps.ver.outputs.arg }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg-pointer
          path: artifacts/dotnet-srndx.*.nupkg

  publish:
    name: Publish to GitHub Packages
    needs: [pack, pack-pointer]
    # Publish from pushes to main (rolling prerelease, version 0.1.0-ci.<run>) and from v* tags (stable,
    # version from the tag). Pull requests build and validate the packages but never publish.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download package artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: nupkg-*
          merge-multiple: true

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://nuget.pkg.github.com/ericstj/index.json
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
